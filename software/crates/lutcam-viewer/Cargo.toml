[package]
name = "lutcam-viewer"
version = "0.1.0"
license.workspace = true
edition.workspace = true
description = "Native dual-camera live view for LUTCam UDP image streams"
default-run = "lutcam-viewer"

[dependencies]
rerun = { version = "=0.34.1", default-features = false, features = ["sdk"] }
re_viewer = { version = "=0.34.1", default-features = false }
re_memory = { version = "=0.34.1", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
lwc = { path = "../lwc" }
lftag = { path = "../lftag" }
lrcca = { path = "../lrcca" }
socket2 = "0.6"
image = { workspace = true, features = ["jpeg"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
